# INDEX.yaml — src/audio
# Audio runtime. SoundEngine owns the Web Audio graph + sequencer
# bridge; machines/ is the modular voice + FX library. Both feed the
# router-driven control plane in modules/.

path: app/src/audio
purpose: >
  All Web Audio code. runtime/sound-engine.ts is the single audio
  runtime — Web Audio graph, sequencer driver (delegated to
  modules/sequencer), master + dry buses, FX returns. machines/ is the
  declarative library of ControllableModules (one per voice archetype,
  one per master FX). engine-adapters.ts wraps the engine state into
  ControllableModules registered at well-known addresses.

last_indexed: 2026-04-28

contents:
  - name: runtime
    kind: folder
    path: runtime
    summary: >
      The instantiated audio runtime — engine class, channel strips,
      kit presets, engine adapters that register modules with the
      router.
    contents:
      - name: sound-engine.ts
        kind: file
        path: runtime/sound-engine.ts
        lines: ~720
        summary: >
          SoundEngine class — the single audio runtime. Owns: master
          GainNode (post-everything output), dry GainNode (channels
          feed it; wet returns are added separately in master),
          analyser node, reverb + delay FX modules with HF/LF damping
          shelves on the wet returns, per-channel ChannelStrips, and
          the sequencer driver (delegated to modules/sequencer).
          Exposes a typed EventBus via getEventBus() that everything
          downstream subscribes to.
        exports:
          - SoundEngine
          - SoundSequence
          - SoundStep
        depends_on:
          - ../machines/registry
          - ../machines/voice-controller
          - ../machines/fx
          - ../../modules/events
          - ../../modules/sequencer
          - ../../modules/audio-graph
          - ../../patterns/types

      - name: engine-adapters.ts
        kind: file
        path: runtime/engine-adapters.ts
        lines: 220
        summary: >
          Translates engine state slots (master.gain, master.dry,
          master.reverb, master.delay, channel.<n>.{level/pan/sends/
          color/machine}) into ControllableModules registered with
          the router. After registration, ParamEvents at those
          addresses dispatch directly into the engine without
          requiring callsite knowledge of which engine setter to call.
        exports:
          - registerEngineMaster
          - registerEngineChannel
          - engineChannelMixer
          - engineChannelColor
          - engineChannelMachine

      - name: ChannelStrip.ts
        kind: file
        path: runtime/ChannelStrip.ts
        lines: 204
        summary: >
          Per-channel mixer + color FX slot. Routes a voice's output
          into level/pan, then into the dry bus (master mix) and
          parallel reverbSend / delaySend taps. The color FX slot is
          rebuilt structurally when ColorFx.type flips.

      - name: kit-presets.ts
        kind: file
        path: runtime/kit-presets.ts
        lines: 136
        summary: >
          The 9 kit presets — 808 / 909 / 707 / 727 / frame / tabla /
          gamelan / congas / latin. Each kit is a 5-channel mapping
          of (label, machine archetype, machine config). Used by
          Practice and Studio when loading a kit by id.

      - name: engine-adapters.test.ts
      - name: sound-engine-bus.test.ts

  - name: machines
    kind: folder
    path: machines
    summary: >
      Declarative voice + FX library. Each machine is a tiny module
      that exposes a ControllableModule via an init function — input
      / output AudioNodes, a list of ParamSpecs, and a .set(name,
      value, opts) method that ramps the underlying AudioParams.
      voice/ is the per-voice archetypes; fx/ is the master + color
      FX. registry.ts is the catalog Sound's UI consumes.
    contents:
      - name: registry.ts
        kind: file
        path: machines/registry.ts
        summary: >
          VOICE_MACHINES catalog — id → (label, init function, default
          config). Source of truth for the Studio UI's machine
          selector. Machine categories (kick/snare/perc/melodic/etc)
          drive grouping in the dropdown.

      - name: types.ts
        kind: file
        path: machines/types.ts
        summary: >
          MachineConfig union, VoiceCtx, VoiceController interface.
          The shape every voice/<arch>.ts implements.

      - name: voice-controller.ts
        kind: file
        path: machines/voice-controller.ts
        summary: >
          triggerVoice(cfg, vc, when, amplitude) — dispatches to the
          right voice/<arch> handler based on cfg.archetype. Called
          from SoundEngine.handleTrigger.

      - name: voice/
        kind: folder
        path: machines/voice
        summary: >
          One file per voice archetype — kick, snare, hat, clap, tom,
          cowbell, modal (bell/tank/etc), pluck, formant (vowel),
          fm (chip), noise (shaker), crackle, phase-distort,
          wavefolder. Each exports a tiny per-trigger renderer.

      - name: fx/
        kind: folder
        path: machines/fx
        summary: >
          Master + per-channel FX modules — reverb (convolver +
          impulse), delay, overdrive, bitcrush, filter, plus a
          shared _shared.ts with rampParam helpers and impulse
          synthesis.

      - name: _shared/
        kind: folder
        path: machines/_shared
        summary: >
          Shared low-level helpers (audio.ts) — context-agnostic
          oscillator / noise / filter constructors.

invariants:
  - "Every voice + FX init function returns a ControllableModule
    whose .set(name, value, opts) ramps via setValueAtTime +
    linearRampToValueAtTime — never bare AudioParam.value writes."
  - "SoundEngine never calls voice handlers directly — it dispatches
    via voice-controller.ts so machine swaps don't ripple through
    the engine."
  - "Master FX wet returns flow through HF (16 kHz, -8 dB) and LF
    (30 Hz, -12 dB) shelves before joining the master bus. Dry path
    stays full-band."

related_indexes:
  - path: ../INDEX.yaml
    why: Parent src/ map.
  - path: ../modules/INDEX.yaml
    why: Bus / router / sequencer modules the engine consumes.
  - path: ../patterns/INDEX.yaml
    why: Pattern schema this engine renders.
