# INDEX.yaml — src/audio
# AudioEngine + kit synthesis. Engine owns the scheduler + master bus;
# per-kit synthesis recipes live under kits/.

path: app/src/audio
purpose: >
  engine.ts owns the Web Audio graph (master bus, reverb send, compressor)
  and the lookahead scheduler with per-track independent subdivisions for
  polyrhythm. Synthesis moved out to kits/ — one KitRecipe per kit,
  looked up by KitId at trigger time. React code touches an AudioEngine
  instance held in App.tsx.

last_indexed: 2026-04-23

contents:
  - name: engine.ts
    kind: file
    path: engine.ts
    lines: 358
    summary: >
      AudioEngine class. Lookahead scheduler (25 ms timer, 120 ms
      scheduleAhead). Per-track nextNoteTimes and nextIdx so each
      track's subdivisions and cycle advance independently — this is
      how polyrhythm is realised. Bar duration is pattern.steps ×
      (60 / BPM); BPM ties to the main division.

      Master bus: master gain → DynamicsCompressor → destination, with
      a parallel ConvolverNode reverb bus whose send is set per-kit from
      kitRecipes[id].reverbSend. trigger() resolves kitRecipes[this.kit]
      .voices[voice](vc, when, amp) — no synthesis code lives here.
      Public state (cursors, bar) is read by the UI each animation frame.
    exports:
      - AudioEngine
    depends_on:
      - ../patterns/types
      - ./kits

  - name: engine.test.ts
    kind: file
    path: engine.test.ts
    lines: 176
    summary: Pure timing/guards tests for AudioEngine — no real AudioContext.

  - name: kits/
    kind: dir
    path: kits
    summary: >
      Per-kit synthesis recipes. Each kit exports a KitRecipe with 5
      VoiceRenderer functions (KK/SN/HH/OH/CP) and a per-kit reverb send
      level. index.ts aggregates them into the `kitRecipes` registry.
      Drum Synth (v2) will reuse these recipes directly.
    contents:
      - name: types.ts
        kind: file
        path: kits/types.ts
        lines: 43
        summary: >
          KitRecipe / VoiceRenderer / VoiceCtx interfaces + connectVoice()
          helper that wires a tail node to the master bus and taps the
          reverb send.
      - name: _util.ts
        kind: file
        path: kits/_util.ts
        lines: 29
        summary: >
          Shared node-creation helpers (createOsc / createGain /
          createBiquad / createNoise) — each takes an AudioContext so kits
          don't need an engine backref.
      - name: index.ts
        kind: file
        path: kits/index.ts
        lines: 34
        summary: >
          kitRecipes registry keyed by KitId + buildVoiceCtx() factory.
          Re-exports the public kit types.
      - name: drum-machine.ts
        kind: file
        path: kits/drum-machine.ts
        lines: 140
        summary: >
          808 / 909 / 707 recipes. Shared branching structure with per-kit
          parameter tables for kick / snare / hat. One file because the
          three kits share the same voice shape and differ only in params.
      - name: tr-727.ts
        kind: file
        path: kits/tr-727.ts
        lines: 91
        summary: >
          727 recipe — Latin percussion remap (low/high conga, cowbell,
          agogo, claves). Separate from drum-machine.ts because the voice
          mapping is structurally different.
      - name: frame-drum.ts
        kind: file
        path: kits/frame-drum.ts
        lines: 132
        summary: >
          Turkish / Arabic / Persian / Balkan frame-drum recipe
          (doum / tek / finger-snap / zils / slap).
      - name: tabla.ts
        kind: file
        path: kits/tabla.ts
        lines: 106
        summary: >
          Indian Hindustani tabla recipe (ge / na / tin / tun / dha).
          Dha (CP) is a composite — ge + na fired together.
      - name: gamelan.ts
        kind: file
        path: kits/gamelan.ts
        lines: 79
        summary: >
          Indonesian gamelan recipe — all voices share one inharmonic
          modal-resonator tone generator, differing only in fundamental /
          partials / decay.

