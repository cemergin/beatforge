# INDEX.yaml — src/patterns/seed
# Per-region seed pattern files, shipped as JSON. 526 patterns total.

path: app/src/patterns/seed
purpose: >
  One JSON file per RegionId. The barrel (index.ts) eager-globs every
  *.json in this directory, runs each entry through the Zod PatternSchema
  from ../schema.ts, and concatenates the parsed arrays into PATTERNS.
  A malformed entry throws at module-load with pattern id + field path.

  Community contributors can add a pattern with a single-file PR editing
  the relevant region's JSON — no TypeScript knowledge required. The
  schema is the authoritative shape contract.

last_indexed: 2026-04-22

aggregate:
  total_patterns: 526
  per_region:
    turkey-ottoman: 20
    balkans: 32
    cuba-afrocaribbean: 32
    arabic-swana: 23
    persia: 13
    india: 47
    west-africa: 40
    brazil: 27
    caribbean: 26
    iberia-flamenco: 25
    gamelan-southeast-asia: 13
    east-asia: 10
    celtic-europe: 28
    electronic-western: 49
    exercise: 5
    andean-south-america: 5
    modern-african: 28
    north-east-african: 21
    central-asian-pacific: 18
    caucasus-mediterranean: 15
    global-electronic: 22
    underground-electronic: 15
    internet-born: 12

load_order:
  # First pass — REGION_ORDER in index.ts (matches legacy concat order).
  # Any JSON not listed here is appended alphabetically by filename.
  - turkey-ottoman
  - balkans
  - cuba-afrocaribbean
  - arabic-swana
  - persia
  - india
  - west-africa
  - brazil
  - caribbean
  - iberia-flamenco
  - gamelan-southeast-asia
  - east-asia
  - celtic-europe
  - electronic-western
  - exercise
  - andean-south-america
  - modern-african
  - north-east-african
  - central-asian-pacific
  - caucasus-mediterranean
  - global-electronic
  - underground-electronic
  - internet-born

schema:
  file: ../schema.ts
  purpose: >
    Zod `PatternSchema`. Enforces enum membership (region/genre/kit/
    difficulty/stepUnit/voices/velocities), grouping.sum === steps,
    bpm.default ∈ [min, max], non-empty tracks. Also exports
    `UserPatternSchema` (Pattern ∩ {user: true, createdAt, updatedAt})
    reused by lib/db.ts for IDB validation.

contents:
  - name: turkey-ottoman.json
    region: turkey-ottoman
    default_kit: frameDrum
    patterns: 20
    summary: >
      Ottoman usul and Anatolian folk aksak rhythms. Kit is frameDrum.
    representative:
      - Karşılama
      - Horon
      - Türk Aksağı
      - Curcuna
      - Düyek

  - name: balkans.json
    region: balkans
    default_kit: frameDrum
    patterns: 32
    summary: >
      Balkan aksak — Bulgarian, Greek, Macedonian, Romani dance rhythms
      in 7/8, 9/8, 11/8, etc.
    representative:
      - Rŭchenitsa
      - Kopanitsa
      - Daichovo
      - Čoček
      - Kalamatianós

  - name: cuba-afrocaribbean.json
    region: cuba-afrocaribbean
    default_kit: "727"
    patterns: 32
    summary: >
      Cuban claves (son, rumba), bembé, guaguancó, cha-cha, bolero.
    representative:
      - Son Clave 3-2
      - Bembé
      - Rumba Clave 3-2
      - Bolero Cubano
      - Cha-Cha-Chá

  - name: arabic-swana.json
    region: arabic-swana
    default_kit: frameDrum
    patterns: 23
    summary: >
      SWANA (Southwest Asia / North Africa) iqa'at — Egyptian, Levantine,
      Maghrebi frame-drum rhythms.
    representative:
      - Maqsoum
      - Baladi
      - Saidi
      - Masmoudi Kebir
      - Wahda

  - name: persia.json
    region: persia
    default_kit: frameDrum
    patterns: 13
    summary: >
      Persian/Iranian classical and folk rhythms for tombak and daf.
    representative:
      - Reng
      - Tasnif
      - Chaharmezrab
      - Kereshmeh

  - name: india.json
    region: india
    default_kit: tabla
    patterns: 47
    summary: >
      Hindustani and Carnatic talas — Tintal, Dadra, Rupak, Ektal, Jhaptal,
      and supplementary theka variations for tabla.
    representative:
      - Tintal
      - Dadra
      - Rupak Tal
      - Ektal
      - Jhaptal

  - name: west-africa.json
    region: west-africa
    default_kit: "727"
    patterns: 40
    summary: >
      Ewe/Ga/Yoruba/Mandé ensemble core parts and bells — Agbekor, Gahu,
      Kpanlogo, Kuku, Soli.
    representative:
      - Agbekor
      - Gahu
      - Kpanlogo
      - Kuku
      - Soli

  - name: brazil.json
    region: brazil
    default_kit: "727"
    patterns: 27
    summary: >
      Brazilian grooves — Bossa Nova, Samba variants, Samba-Reggae,
      Baião, Maracatu.
    representative:
      - Bossa Nova
      - Samba Partido Alto
      - Samba-Reggae
      - Baião
      - Maracatu

  - name: caribbean.json
    region: caribbean
    default_kit: "727"
    patterns: 26
    summary: >
      Non-Cuban Caribbean — Dembow/Reggaeton, Dancehall, Kompa, Soca,
      Calypso. Some patterns override default_kit to 808.
    representative:
      - Reggaeton Dembow
      - Dancehall
      - Kompa
      - Soca
      - Calypso

  - name: iberia-flamenco.json
    region: iberia-flamenco
    default_kit: "727"
    patterns: 25
    summary: >
      Flamenco compases — Bulería, Soleá, Tangos (flamenco), Seguiriya,
      Alegrías, plus Iberian folk.
    representative:
      - Bulería
      - Soleá
      - Tangos (Flamenco)
      - Seguiriya
      - Alegrías

  - name: gamelan-southeast-asia.json
    region: gamelan-southeast-asia
    default_kit: gamelan
    patterns: 13
    summary: >
      Javanese/Balinese gamelan forms — Lancaran, Kotekan, Ketawang,
      Ladrang — plus broader Southeast-Asian cycles.
    representative:
      - Lancaran
      - Kotekan
      - Gendhing Sederhana
      - Ketawang
      - Ladrang

  - name: east-asia.json
    region: east-asia
    default_kit: "808"
    patterns: 10
    summary: >
      Japanese and Korean rhythms — Taiko jiuchi/matsuri, Yatai-bayashi,
      Samulnori jajinmori, Gutgeori changdan. Some patterns use gamelan
      kit.
    representative:
      - Taiko Jiuchi
      - Samulnori · Jajinmori
      - Taiko · Matsuri
      - Yatai-bayashi
      - Gutgeori Changdan

  - name: celtic-europe.json
    region: celtic-europe
    default_kit: "707"
    patterns: 28
    summary: >
      Irish and Scandinavian dance rhythms — Reel, Jig, Hornpipe, Slip Jig,
      Polska variants.
    representative:
      - Irish Reel
      - Irish Jig
      - Scandi Polska
      - Irish Hornpipe
      - Slip Jig

  - name: electronic-western.json
    region: electronic-western
    default_kit: "909"
    patterns: 49
    summary: >
      Largest seed file — 49 patterns covering rock, pop, hip-hop,
      house, techno, drum'n'bass, trap, etc. Default kit is 909 but
      many patterns explicitly use 808 or 707.
    representative:
      - Boom Bap
      - Four on the Floor
      - Standard Rock Beat
      - Anthemic Rock
      - Pop Clap Beat

  - name: exercise.json
    region: exercise
    default_kit: "707"
    patterns: 5
    summary: >
      Polyrhythm training exercises — Hemiola 3:2, 3:4 triplets, 4:3,
      5:4, 7:4. Uses per-track subdivisions (full Track form). Not
      regional — the exercise region exists specifically for these.
    representative:
      - Hemiola (3:2)
      - Triplets over Quarters (3:4)
      - Four over Three (4:3)
      - Five over Four (5:4)
      - Seven over Four (7:4)

  - name: andean-south-america.json
    region: andean-south-america
    default_kit: "727"
    patterns: 5
    summary: >
      Andean and Southern Cone folk dances — Huayno, Chacarera, Zamba,
      Cueca, Carnavalito.
    representative:
      - Huayno
      - Chacarera
      - Zamba
      - Cueca
      - Carnavalito

  - name: modern-african.json
    region: modern-african
    default_kit: "727"
    patterns: 28
    summary: >
      Afropop, highlife, soukous, makossa, gqom, kwaito — contemporary
      pan-African grooves.

  - name: north-east-african.json
    region: north-east-african
    default_kit: frameDrum
    patterns: 21
    summary: >
      Gnawa, Ethiopian, Somali, Sufi — North/East African traditions.

  - name: central-asian-pacific.json
    region: central-asian-pacific
    default_kit: frameDrum
    patterns: 18
    summary: >
      Uzbek, Uyghur, Afghan rhythms alongside Polynesian and Aboriginal
      cycles.

  - name: caucasus-mediterranean.json
    region: caucasus-mediterranean
    default_kit: frameDrum
    patterns: 15
    summary: >
      Georgia, Armenia, Crete, Sicily, Sufi dhikr.

  - name: global-electronic.json
    region: global-electronic
    default_kit: "909"
    patterns: 22
    summary: >
      Funkot, budots, vinahouse, baile funk, drill — global dance floors.

  - name: underground-electronic.json
    region: underground-electronic
    default_kit: "808"
    patterns: 15
    summary: >
      Mahraganat, dabke-electronic, guaracha, hardbass — underground
      electronic traditions.

  - name: internet-born.json
    region: internet-born
    default_kit: "909"
    patterns: 12
    summary: >
      Vaporwave, lo-fi hip-hop, hyperpop, drift-phonk — internet-native
      microgenres.

  - name: index.ts
    kind: file
    summary: >
      Barrel. Eager-globs all *.json, parses each entry through
      PatternSchema, exposes PATTERNS + registerPatternSource +
      patternById (the user-pattern resolution hook).
    exports:
      - PATTERNS
      - registerPatternSource
      - patternById

contributing:
  how_to_add_a_pattern: >
    1. Open the relevant `seed/<region>.json` file.
    2. Add your pattern object at the end of the array, matching the
       shape of existing entries.
    3. Run `bun run test` locally — the schema test will reject malformed
       entries with the exact field path.
    4. Open a PR. CI runs the build, which re-validates every pattern.

related_indexes:
