related_indexes:
  - path: ../INDEX.yaml
    why: Where in the app this folder sits.
  - path: seed/INDEX.yaml
    why: Per-region pattern counts, default kits, representative names.
  - path: ../audio/INDEX.yaml
    why: The engine that consumes these patterns.
  - path: ../../../research/patterns/INDEX.yaml
    why: The markdown corpus these seeds were transcribed from.
