<!doctype html>
<html lang="en" data-theme="warm">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e17055" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BeatForge" />
    <title>BeatForge — World-rhythm metronome</title>
    <meta name="description" content="Browser-based world-rhythm metronome. 294 rhythms across 16 traditions, 7 synthesized kits, polyrhythm overlay, per-group accents. Works offline. No install, no backend." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BeatForge" />
    <meta property="og:title" content="BeatForge — World-rhythm metronome" />
    <meta property="og:description" content="294 rhythms across 16 traditions. 7 synthesized kits. Polyrhythm overlay. Plays 9/8 as 2+2+2+3. Works offline." />
    <meta property="og:url" content="https://cemergin.github.io/beatforge/" />
    <meta property="og:image" content="https://cemergin.github.io/beatforge/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BeatForge — a beat-group ring in coral/gold/purple/green beside the wordmark and feature chips (9/8, 2+2+2+3, 3:4 poly, tabla)." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BeatForge — World-rhythm metronome" />
    <meta name="twitter:description" content="294 rhythms. 7 kits. Polyrhythm overlay. Works offline." />
    <meta name="twitter:image" content="https://cemergin.github.io/beatforge/og-image.svg" />
    <meta name="twitter:image:alt" content="BeatForge logo with rhythm traditions tagline" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply persisted theme before first paint
      try {
        const t = localStorage.getItem('bf_theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
