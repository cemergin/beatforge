# INDEX.yaml — /docs
# Specs + architecture + topical reference + process archive.

path: docs
purpose: >
  Documentation for BeatForge, in four sections: specs (what BeatForge is),
  architecture (current code), topics (subject-organized reference material
  that grew out of building it), and process (historical design + engineering
  artifacts). Each subdirectory has its own README that maps the chunks
  inside.

last_indexed: 2026-04-29

contents:
  - name: README.md
    kind: file
    path: README.md
    summary: >
      Master entry point. Explains the four sections and provides quick
      paths for common questions.

  - name: spec
    kind: folder
    path: spec
    stability: stable
    summary: >
      Shipping product specs. metronome.md is the authoritative v1 scope
      (React + Vite + TS, GitHub Pages, 5 voices, 7 kits, three modes).
      library-content.md is the design for how the rhythm-traditions
      research surfaces inside Library mode (four-layer depth model).

  - name: architecture
    kind: folder
    path: architecture
    stability: stable
    summary: >
      Current code architecture. overview.md is the 10,000ft view;
      audio-engine.md, sequencer-and-patterns.md, and react-app.md are
      the three layered deep-dives. Kept current with the shipping code.

  - name: topics
    kind: folder
    path: topics
    stability: stable
    summary: >
      Subject-organized reference material — ~64K lines across 8 topic
      folders. Each folder is a curated set of chunks with its own README
      gateway. Topics: audio-synthesis, midi, pwa-audio, rhythm-traditions
      (28 region files), rhythm-patterns (20 pattern files, 600+ patterns),
      rhythm-engine, interface (UI/UX research), practice (pedagogy).

  - name: process
    kind: folder
    path: process
    stability: archived
    summary: >
      Historical artifacts kept for reasoning, not for "what's shipping
      today." Design reviews (7 personas + synthesis), manifestos (living
      archive + voice guide), engineering audit passes (4 + notes),
      superseded plans, and the original March product spec.

related_indexes:
  - path: ../INDEX.yaml
    why: Repo root — where docs/ fits in the project.
  - path: ../app/INDEX.yaml
    why: Code that implements the specs.
