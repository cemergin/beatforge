# Product + design specifications.

path: docs
purpose: >
  Specifications that define BeatForge's intent. The 2026-04-22
  metronome-design spec is the authoritative scope for the shipping
  v1. Older specs are retained for historical context — they describe
  a broader vision (SvelteKit, full drum machine) that was split into
  two projects.

