<!DOCTYPE html>
<html lang="en" data-theme="warm">
<head>
<meta charset="utf-8" />
<title>BeatForge</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css" />
</head>
<body>
<div id="root"></div>

<script>
// Tweak defaults (persisted across loads via host)
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "warm",
  "view": "pill",
  "kit": "707"
}/*EDITMODE-END*/;
// Apply to localStorage for initial render (only if unset)
Object.entries(TWEAK_DEFAULTS).forEach(([k, v]) => {
  const lk = 'bf_' + k;
  if (localStorage.getItem(lk) === null) localStorage.setItem(lk, v);
});
document.documentElement.dataset.theme = localStorage.getItem('bf_theme') || TWEAK_DEFAULTS.theme;
</script>

<script type="module">
  // Load patterns as UMD-ish side-effect script
  const src = await (await fetch('src/patterns.js')).text();
  const mod = {};
  // Strip `export` to drop into global scope
  const code = src.replace(/export\s+const\s+PATTERNS/, 'window.PATTERNS = window.PATTERNS || null; var PATTERNS')
                  .replace(/export\s+function\s+patternById/, 'function patternById');
  new Function(code + '; window.PATTERNS = PATTERNS; window.patternById = patternById;')();
  window.dispatchEvent(new Event('bf-patterns-ready'));
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  // Engine — plain JS, class attached to window
  (async () => {
    const src = await (await fetch('src/engine.js')).text();
    const code = src.replace(/export\s+class\s+AudioEngine/, 'class AudioEngine');
    new Function(code + '; window.AudioEngine = AudioEngine;')();
    window.dispatchEvent(new Event('bf-engine-ready'));
  })();
</script>

<script type="text/babel" src="src/views.jsx"></script>
<script type="text/babel" src="src/widgets.jsx"></script>
<script type="text/babel" src="src/practice.jsx"></script>
<script type="text/babel" src="src/library.jsx"></script>
<script type="text/babel" src="src/studio.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>

<script type="text/babel">
  function boot() {
    if (!window.PATTERNS || !window.AudioEngine || !window.App) {
      return setTimeout(boot, 40);
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<window.App />);
  }
  boot();
</script>
</body>
</html>
