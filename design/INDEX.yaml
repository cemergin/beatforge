# INDEX.yaml — /design (pre-port React prototype)
# Reference implementation the shipping app was translated from.

path: design
purpose: >
  Static HTML + plain-JSX prototype with no build step. Opens in a
  browser via design/BeatForge.html using an import map. The shipping
  app in /app/ was ported from these files; use them when Practice /
  Studio / Library behaviour in the port feels off and you need a
  ground-truth comparison.

last_indexed: 2026-04-23

stability: deprecated

contents:
  - name: BeatForge.html
    kind: file
    path: BeatForge.html
    summary: >
      Single-page host for the prototype. Loads React via import
      map, then boots src/app.jsx. No bundler.

  - name: src/app.jsx
    kind: file
    path: src/app.jsx
    summary: >
      Prototype root — tab routing, theme toggle, AudioEngine
      wiring. Mirrors app/src/App.tsx but in JSX.

  - name: src/engine.js
    kind: file
    path: src/engine.js
    summary: >
      Plain-JS AudioEngine. The port target for
      app/src/audio/engine.ts; kits, scheduler, and synthesis
      recipes originated here.
    related: [../app/src/audio/engine.ts]

  - name: src/patterns.js
    kind: file
    path: src/patterns.js
    summary: >
      Single-file pattern library used by the prototype before the
      per-region split. Historical reference for the pre-split
      seed ordering.
    related: [../app/src/patterns/seed/index.ts]

  - name: src/practice.jsx
    kind: file
    path: src/practice.jsx
    summary: >
      Practice mode JSX — reference for app/src/modes/Practice/.

  - name: src/studio.jsx
    kind: file
    path: src/studio.jsx
    summary: >
      Studio mode JSX — reference for app/src/modes/Studio/.

  - name: src/library.jsx
    kind: file
    path: src/library.jsx
    summary: >
      Library mode JSX — reference for app/src/modes/Library/.

  - name: src/views.jsx
    kind: file
    path: src/views.jsx
    summary: >
      Shared view primitives — step grids, pills, dots. Ported to
      app/src/components/.

  - name: src/widgets.jsx
    kind: file
    path: src/widgets.jsx
    summary: >
      Shared widget controls — sliders, chips, transport buttons.

  - name: src/styles.css
    kind: file
    path: src/styles.css
    summary: >
      Prototype stylesheet. The app's app.css evolved from this.

  - name: scraps
    kind: folder
    path: scraps
    summary: >
      Misc. design artifacts (sketches). Not referenced by the
      prototype itself.
    stability: experimental

related_indexes:
  - path: ../INDEX.yaml
    why: Repo root.
  - path: ../app/INDEX.yaml
    why: The ported app this prototype was translated into.
