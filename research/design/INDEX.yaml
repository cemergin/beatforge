# INDEX.yaml — research/design
# UI, visual, and sound-design references.

path: research/design
purpose: >
  Design references used to ground the React app's look, feel, and
  sonic palette. Read these when making UI or sound-design decisions
  and you want prior art rather than raw technical APIs.

last_indexed: 2026-04-23

contents:
  - name: brainstorm-notes.md
    kind: file
    path: brainstorm-notes.md
    lines: 307
    summary: >
      Raw interview notes from the v1 product-design session. The
      "why" behind many decisions in the April metronome spec lives
      here in unfiltered form.

  - name: instrument-hardware-ui-design.md
    kind: file
    path: instrument-hardware-ui-design.md
    lines: 818
    summary: >
      Hardware instrument UI idioms — knobs, pads, transport,
      step-sequencer conventions from Roland, Elektron, Akai, Korg,
      Arturia, etc.

  - name: music-software-ui-design.md
    kind: file
    path: music-software-ui-design.md
    lines: 1376
    summary: >
      Software DAW / music-app UI patterns — timelines, step grids,
      mixer strips, piano rolls, browser panes. Largest of the
      design files.

  - name: music-visual-design-systems.md
    kind: file
    path: music-visual-design-systems.md
    lines: 1230
    summary: >
      Visual-design systems for music software — color, typography,
      iconography, rhythm visualization. Informed BeatForge's
      warm/noir/paper themes and circular/linear/pill grids.

  - name: world-percussion-sound-design.md
    kind: file
    path: world-percussion-sound-design.md
    lines: 296
    summary: >
      Sound-design targets for world-percussion kits (frameDrum,
      tabla, gamelan) — references and synthesis heuristics for
      the engine's non-drum-machine kits.
    related: [../../app/src/audio/engine.ts]

