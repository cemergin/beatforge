# INDEX.yaml — research/patterns
# Notated rhythm grids — transcription source for app seed patterns.

path: research/patterns
purpose: >
  19 files of notated patterns in step-sequencer-style grids, organised
  by macro-region or genre family. These are the transcription source
  for app/src/patterns/seed/. Pattern counts below are approximate
  (counted from headings / grid blocks during indexing, not verified
  exactly).

last_indexed: 2026-04-23

contents:
  - name: turkish-arabic-indian.md
    kind: file
    path: turkish-arabic-indian.md
    lines: 2202
    summary: >
      Turkish usul, Arabic iqa'at, and Indian tala families in one
      file. Primary source for turkey-ottoman.ts, arabic-swana.ts,
      and india.ts seeds.
    regions_covered:
      - turkey-ottoman
      - arabic-swana
      - india
    related:
      - ../../app/src/patterns/seed/turkey-ottoman.ts
      - ../../app/src/patterns/seed/arabic-swana.ts
      - ../../app/src/patterns/seed/india.ts

