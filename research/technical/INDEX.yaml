# INDEX.yaml — research/technical
# Engineering references — audio, MIDI, PWA, pedagogy, sequencer architecture.

path: research/technical
purpose: >
  Deep-dive references used when implementing the audio engine, PWA
  shell, keyboard/pad UX, polyrhythmic sequencer, and practice-mode
  pedagogy. Read these when you need to build or extend the
  infrastructure — not for musicology.

last_indexed: 2026-04-23

contents:
  - name: web-audio-dsp-reference.md
    kind: file
    path: web-audio-dsp-reference.md
    lines: 2577
    summary: >
      AudioContext / AudioParam / AudioWorklet, DSP primitives
      (filters, envelopes, oscillators, noise, distortion,
      compression, reverb, delay), scheduling theory,
      OfflineAudioContext, AnalyserNode, synthesis recipes (808
      kick, 909 snare, FM, Karplus-Strong).
    related: [../../app/src/audio/engine.ts]

  - name: WEB_AUDIO_REFERENCE.md
    kind: file
    path: WEB_AUDIO_REFERENCE.md
    lines: 2604
    summary: >
      Ecosystem reference. WAM 2.0 plugin API (WamNode, WamProcessor,
      WamEnv, WamGroup), Tone.js deep dive (Transport, MembraneSynth,
      MetalSynth, NoiseSynth, Player, Sequence), comparison of
      adjacent libraries.

  - name: MIDI_TECHNICAL_REFERENCE.md
    kind: file
    path: MIDI_TECHNICAL_REFERENCE.md
    lines: 2296
    summary: >
      MIDI 1.0 protocol, channel and system messages, GM drum map
      (notes 27-81), velocity curves, CC table, MIDI clock, MIDI
      2.0, Web MIDI API, .mid file format, MIDI file generation in
      JS.

  - name: pwa-audio-reference.md
    kind: file
    path: pwa-audio-reference.md
    lines: 3191
    summary: >
      Web app manifest, service worker lifecycle, cache strategies
      (cache-first, network-first, SWR), Workbox, offline audio,
      IndexedDB, Background Sync, Media Session API, Wake Lock,
      Web Share, storage management. Largest file in technical/.
    related: [../../app/vite.config.ts, ../../app/src/lib/pwa.tsx]

  - name: drum-machine-keyboard-reference.md
    kind: file
    path: drum-machine-keyboard-reference.md
    lines: 1860
    summary: >
      QWERTY-to-pad mappings (Ableton, FL Studio, custom), keyboard
      shortcuts for production, keydown implementation, velocity
      layers, focus management, accessibility.

  - name: turkish-rhythmic-systems-reference.md
    kind: file
    path: turkish-rhythmic-systems-reference.md
    lines: 1452
    summary: >
      Ottoman usul system, Düm/Tek/Ka stroke vocabulary, simple to
      compound meters (2/4 through 120 beats), usul vs Western
      meter, notation systems, regional folk rhythms. Authoritative
      reference for turkey-ottoman seeds.
    related: [../../app/src/patterns/seed/turkey-ottoman.ts]

  - name: drum-machine-practice-methodology.md
    kind: file
    path: drum-machine-practice-methodology.md
    lines: 1336
    summary: >
      Deliberate practice theory (Ericsson), speed-training
      protocols, random-mute exercises, 40 PAS rudiments,
      polyrhythm training, odd-meter acclimation, konnakol, groove
      templates, spaced repetition. Backs Practice/Trainer.tsx.
    related: [../../app/src/modes/Practice/Trainer.tsx]

  - name: polyrhythmic-sequencer-architecture.md
    kind: file
    path: polyrhythmic-sequencer-architecture.md
    lines: 917
    summary: >
      Universal rhythm engine design — atomic patterns (variable
      steps, stepsPerBeat, beat grouping, micro-timing), stack
      operator (polyrhythm via independent cursors, LCM super-
      cycle), chain operator (song/zencir mode), TypeScript
      scheduling engine, UI visualization (linear/circular/chain),
      progressive disclosure, JSON pattern format, Euclidean rhythm
      generation, phase mapping. Most directly reflects the shipped
      AudioEngine.
    related: [../../app/src/audio/engine.ts]

related_indexes:
  - path: ../INDEX.yaml
    why: Corpus root.
  - path: ../../app/src/audio/INDEX.yaml
    why: Engine implementation informed by these docs.
