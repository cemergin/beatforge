# INDEX.yaml — BeatForge repository root
# Top-level map of the project. Start here to decide which subtree to enter.

path: .
purpose: >
  BeatForge is a browser-based world-rhythm metronome + drum machine. This
  root contains the React app, the pre-port prototype, and a unified docs
  tree (specs + architecture + topical reference + process archive). Pick
  a subtree below and follow its own INDEX.yaml for detail.

last_indexed: 2026-04-29

state:
  version: v1 (metronome) + Studio sequencer + secret MIDI tab
  status: "v1 shipped, 536 patterns, user-testing phase; MIDI I/O + Studio audio bus added 2026-04-28"
  deploy_url: https://cemergin.github.io/beatforge/
  authoritative_spec: docs/spec/metronome.md
  library_content_design: docs/spec/library-content.md
  recent_review: docs/process/engineering-audits/notes-2026-04-28.md
  tech_stack:
    - React 19
    - Vite 8
    - TypeScript
    - Bun (package manager + CI)
    - Dexie (IndexedDB)
    - Fuse.js (fuzzy search)
    - vite-plugin-pwa + workbox-window
    - Web MIDI API (secret tab, ?tab=_midi)

contents:
  - name: app
    kind: folder
    path: app
    summary: >
      The shipping React application — Practice, Studio, Library, and a
      hidden MIDI tab, all backed by a single SoundEngine and a 536-pattern
      seed corpus. All code destined for production lives here.
    related: [app/INDEX.yaml]

  - name: docs
    kind: folder
    path: docs
    summary: >
      Documentation in four sections: spec/ (shipping product specs),
      architecture/ (code architecture), topics/ (subject-organized
      reference — ~64K lines on audio synthesis, MIDI, PWA, rhythm
      traditions, patterns, engine, interface, practice), and process/
      (historical design + engineering artifacts). Start at docs/README.md.
    related: [docs/INDEX.yaml]

  - name: README.md
    kind: file
    path: README.md
    summary: >
      Public-facing project overview — pitch, feature list, phased roadmap,
      contribution notes. Targeted at humans landing on the repo.

  - name: CONTRIBUTING.md
    kind: file
    path: CONTRIBUTING.md
    summary: >
      How to contribute patterns, file bugs, and submit code PRs. Includes
      pattern schema example, voice-key conventions, and cultural-sensitivity
      notes for the rhythm-traditions material.

  - name: LICENSE
    kind: file
    path: LICENSE
    summary: >
      MIT license. Cultural-attribution paragraph at the bottom flags that
      pattern stories under app/src/patterns/seed/ draw from public musicology
      research and practitioner conversations — corrections welcome.

  - name: .github/workflows/deploy.yml
    kind: file
    path: .github/workflows/deploy.yml
    summary: >
      GitHub Pages deploy pipeline. Bun install, tsc -b, vite build from
      app/, publishes app/dist. Triggers on pushes to main.

related_indexes:
  - path: app/INDEX.yaml
    why: Enter this when the question is about runtime behavior, UI, or shipping code.
  - path: docs/INDEX.yaml
    why: Enter this for product intent, architecture, topical reference, or design history.
