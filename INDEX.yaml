# INDEX.yaml — BeatForge repository root
# Top-level map of the project. Start here to decide which subtree to enter.

path: .
purpose: >
  BeatForge is a browser-based world-rhythm metronome (shipping) and future drum
  synth. This root contains the React app, pre-port prototype, specs, and a
  deep musicology/pattern research corpus. Pick a subtree below and follow its
  own INDEX.yaml for detail.

last_indexed: 2026-04-28

state:
  version: v1 (metronome) + Studio sequencer + secret MIDI tab
  status: "v1 shipped, 536 patterns, user-testing phase; MIDI I/O + Studio audio bus added 2026-04-28"
  deploy_url: https://cemergin.github.io/beatforge/
  authoritative_spec: docs/superpowers/specs/2026-04-22-beatforge-metronome-design.md
  legacy_spec: docs/2026-03-12-beatforge-product-design.md
  recent_review: docs/2026-04-28-engineering-review-notes.md
  tech_stack:
    - React 19
    - Vite 8
    - TypeScript
    - Bun (package manager + CI)
    - Dexie (IndexedDB)
    - Fuse.js (fuzzy search)
    - vite-plugin-pwa + workbox-window
    - Web MIDI API (secret tab, ?tab=_midi)

contents:
  - name: app
    kind: folder
    path: app
    summary: >
      The shipping React application — Practice, Studio, Library, and a
      hidden MIDI tab, all backed by a single SoundEngine and a 536-pattern
      seed corpus. All code destined for production lives here.
    related: [app/INDEX.yaml]

  - name: design
    kind: folder
    path: design
    summary: >
      Pre-port React prototype (plain JSX + CSS, no build). The reference
      implementation the app was translated from. Useful for comparing
      behavior when something in the ported app seems off.
    related: [design/INDEX.yaml]
    stability: deprecated

  - name: docs
    kind: folder
    path: docs
    summary: >
      Product and design specs. The v1 metronome spec under
      superpowers/specs/ is the authoritative document; the March product
      design spec is an older, broader vision kept for context.
    related: [docs/INDEX.yaml]

  - name: research
    kind: folder
    path: research
    summary: >
      Deep corpus (~78K lines): musicology, notated patterns, technical
      references, design references. Sources for both the seed patterns and
      the planned Library cultural stories.
    related: [research/INDEX.yaml]

  - name: README.md
    kind: file
    path: README.md
    summary: >
      Public-facing project overview — pitch, feature list, phased roadmap,
      contribution notes. Targeted at humans landing on the repo.

  - name: .github/workflows/deploy.yml
    kind: file
    path: .github/workflows/deploy.yml
    summary: >
      GitHub Pages deploy pipeline. Bun install, tsc -b, vite build from
      app/, publishes app/dist. Triggers on pushes to main.

related_indexes:
  - path: app/INDEX.yaml
    why: Enter this when the question is about runtime behavior, UI, or shipping code.
  - path: research/INDEX.yaml
    why: Enter this for musicology, pattern notation, technical deep-dives.
  - path: docs/INDEX.yaml
    why: Enter this for product intent and design decisions.
